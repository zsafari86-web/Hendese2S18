<style>

*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font-family:Vazirmatn,Tahoma,sans-serif;background:var(--bg);color:var(--ink);line-height:2;

.dots{display:flex;gap:6px}

.dots button.on{background:#fff;color:var(--teal);font-weight:800}
.skip{border:0;background:rgba(255,255,255,.2);color:#fff;border-radius:8px;padding:2px 12px;font:inherit;cursor:pointer}
main{max-width:760px;margin:0 auto;padding:0 14px 60px}
#fig{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;padding-top:10px;background:var(--bg)}
#fig:empty{display:none}
#txt>*{scroll-margin-top:46vh}
h2{margin:14px 0 6px;font-size:1.3rem;color:var(--teal);font-weight:800}
.p,.ex{margin:8px 0}

.ex{border-right:4px solid var(--pink);padding:2px 12px;background:var(--card);border-radius:6px}
.typing::after{content:"▍";color:var(--pink);animation:bl 1s steps(2) infinite}
@keyframes bl{50%{opacity:0}}
.demo,.quiz{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px;margin:12px 0}
#fig .demo{margin:0;box-shadow:0 8px 10px -8px rgba(0,0,0,.4)}
svg{user-select:none;-webkit-user-select:none;width:100%;height:auto;display:block;direction:ltr;touch-action:none;max-height:38vh}
.ro{direction:ltr;display:none;grid-template-columns:1fr 1fr;gap:0 14px;font-size:.9rem;padding:2px 8px;color:var(--mut)}
.ro b{color:var(--ink)}
button.go,.opt{font:inherit;cursor:pointer;border-radius:10px;border:2px solid var(--teal);background:transparent;color:var(--ink);padding:3px 14px}

.opts{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.opt{min-width:90px;font-weight:600}
.opt.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.no{border-color:var(--pink);color:var(--pink)}
.fb{min-height:1.8em;color:var(--mut)}
.hd{cursor:grab}
.hr{fill:none;stroke:var(--pink);stroke-width:2;stroke-dasharray:4 4;pointer-events:none}
circle.cir{fill:none;stroke:var(--ink);stroke-width:2}
.ln{stroke:var(--ink);stroke-width:1.8}
.pt{fill:var(--card);stroke:var(--ink);stroke-width:2}
.pt.hd{stroke:var(--pink);stroke-width:3}
.mk{fill:none;stroke:var(--mut);stroke-width:2.5}
.tf{fill:none;stroke:none}
.sc{fill:none;stroke:var(--mut);stroke-width:1.5}
.st{font-weight:800;color:var(--pink);margin:14px 0 2px}
.h1{stroke:var(--teal);stroke-width:4}.h2{stroke:var(--pink);stroke-width:4}.h3{stroke:var(--am);stroke-width:5}
.tf.h1{fill:var(--teal);fill-opacity:.3;stroke-width:2}.tf.h2{fill:var(--pink);fill-opacity:.3;stroke-width:2}.tf.h3{fill:var(--am);fill-opacity:.2;stroke-width:2;stroke-dasharray:6 4}
.pt.h3{fill:var(--am)}
.h4{stroke:#8e63f2;stroke-width:4}
.tf.h4{fill:#8e63f2;fill-opacity:.3;stroke-width:2}
.sc.h3{fill:var(--am);fill-opacity:.5;stroke:var(--am);stroke-width:2}.sc.h4{fill:#8e63f2;fill-opacity:.5;stroke:#8e63f2;stroke-width:2}
text.lb{font:600 16px Vazirmatn,sans-serif;fill:var(--ink)}

.nf{animation:fi 1s}

</style>

 e.classList.add('typing');const re=/(\S+) \/ (\S+)/g;let last=0,m,parts=[];
 while((m=re.exec(str))){if(m.index>last)parts.push(str.slice(last,m.index));parts.push([m[1],m[2]]);last=re.lastIndex}

 for(const pt of parts){

  scroll(e);
 }
 e.classList.remove('typing');
}

 h:'طول کل قاطع MB برابر x + 21 است. رابطهٔ MT² = MA × MB را بنویس: 100 = x(x + 21).',
 e:'معادله به صورت x² + 21x - 100 = 0 درمی‌آید که ریشهٔ مثبت آن (x - 4)(x + 25) = 0 یعنی x = 4 است.'
}],
['quiz',{
 q:'اگر نقطهٔ M درون یک دایره ثابت باشد، کدام عبارت دربارهٔ تمام وترهایی که از نقطهٔ M می‌گذرند همیشه درست است؟',
 o:['حاصل‌ضرب فاصله‌های M تا دو سر هر وتر همیشه مقداری ثابت است','مجموع فاصله‌های M تا دو سر هر وتر همیشه مقداری ثابت است','زاویهٔ بین هر دو وتر متقاطع همیشه قائمه است'],
 a:0,
 h:'به اصل قضیه فکر کن: در تمام وترهای گذرنده از M، ضرب MA · MB چه خاصیتی دارد؟',
 e:'طبق قضیهٔ وترهای متقاطع، برای هر وتری مثل AB که از M درون دایره بگذرد، حاصل‌ضرب MA × MB همواره عددی ثابت است.'
}],
['p','آفرین! شما تمامی مفاهیم و رابطه‌های طولی دایره را با موفقیت یاد گرفتید و تمرین‌ها را حل کردید. 🎉']
]}
];

function mark(i){document.querySelectorAll('#dots button').forEach((b,j)=>b.classList.toggle('on',i===j));}
S.forEach((s,i)=>{const b=el('button');b.textContent=i+1;b.onclick=()=>stage(i);$('#dots').append(b)});

async function stage(i){
 const tok=++run;fast=false;const s=S[i],box=$('#txt');box.innerHTML='';mark(i);window.scrollTo(0,0);
 $('#fig').innerHTML='';F=s.k?mkFig(s.k,s.init):null;if(F)$('#fig').append(F.w);
 const h=el('h2');box.append(h);await typeInto(h,s.h,tok);
 for(const [k,v,sh,hl] of s.items){
  if(tok!==run)return;
  if(k==='quiz'){await quiz(box,v);continue}
  if(k==='btn'){await gate(box,v);continue}
  if(k==='fig'){const G=mkFig(v,SIMPLE[v]);G.free(1);G.cue('',sh);box.append(G.w);scroll(G.w);if(!fast)await sleep(900);continue}
  const e=el('div',k==='free'?'p':k);box.append(e);scroll(e);
  if(k==='free')F.free();
  const segs=Array.isArray(v)?v:[[v,sh,hl]];
  for(const [t,a,b] of segs){if(tok!==run)return;if(F&&k!=='free'&&(a!=null||b))F.cue(a,b);await (k==='f'?typeFormula:typeInto)(e,t,tok);}
  if(!fast)await sleep(k==='p'||k==='ex'||k==='d'?700:400);
  if(k==='free')await gate(box,'فهمیدم، ادامه بده');
 }
 if(tok!==run)return;
 const n=el('button','go');n.textContent=i<S.length-1?'بحث بعدی ◀':'شروع دوباره';n.onclick=()=>stage((i+1)%S.length);box.append(n);scroll(n);
}
function gate(box,label){return new Promise(r=>{const b=el('button','go');b.textContent=label;b.onclick=()=>{b.remove();r()};box.append(b);scroll(b)})}
function quiz(box,v){return new Promise(res=>{
 const q=el('div','quiz'),t=el('b'),row=el('div','opts'),fb=el('div','fb');t.textContent=v.q;
 v.o.forEach((s,i)=>{const b=el('button','opt');b.dir='auto';b.textContent=s;b.onclick=()=>{
  if(i===v.a){b.classList.add('ok');fb.textContent='آفرین! '+v.e;row.querySelectorAll('button').forEach(x=>x.disabled=true);setTimeout(res,1500);}
  else{b.classList.add('no');fb.textContent='دوباره فکر کن. راهنما: '+v.h;}};row.append(b)});
 q.append(t,row,fb);box.append(q);scroll(q);})}

/* ---------- geometry ---------- */
const O={x:180,y:200},R=115,U=20,PI=Math.PI;
const P=a=>({x:O.x+R*Math.cos(a),y:O.y+R*Math.sin(a)});
const ang=p=>Math.atan2(p.y-O.y,p.x-O.x);
const dist=(p,q)=>Math.hypot(p.x-q.x,p.y-q.y);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const nrm=x=>((x%(2*PI))+2*PI)%(2*PI);
function inter(p1,p2,p3,p4){const d=(p1.x-p2.x)*(p3.y-p4.y)-(p1.y-p2.y)*(p3.x-p4.x);if(Math.abs(d)<1e-6)return null;
 const a=p1.x*p2.y-p1.y*p2.x,b=p3.x*p4.y-p3.y*p4.x;return{x:(a*(p3.x-p4.x)-(p1.x-p2.x)*b)/d,y:(a*(p3.y-p4.y)-(p1.y-p2.y)*b)/d}}
function sec(M,A){const dx=A.x-M.x,dy=A.y-M.y,L=Math.hypot(dx,dy)||1,ux=dx/L,uy=dy/L,fx=M.x-O.x,fy=M.y-O.y;
 const b=fx*ux+fy*uy,c=fx*fx+fy*fy-R*R,s=Math.sqrt(Math.max(b*b-c,0));
 return[-b-s,-b+s].map(t=>({x:M.x+t*ux,y:M.y+t*uy}))}
function tangent(M){const d=dist(M,O),f=Math.atan2(M.y-O.y,M.x-O.x),al=Math.acos(R/d),a=P(f+al),b=P(f-al);return a.y<b.y?a:b}
const mkp=(V,P1,P2,r)=>{const a1=Math.atan2(P1.y-V.y,P1.x-V.x),a2=Math.atan2(P2.y-V.y,P2.x-V.x);let d=a2-a1;while(d>PI)d-=2*PI;while(d<=-PI)d+=2*PI;
 return`M${V.x} ${V.y}L${V.x+r*Math.cos(a1)} ${V.y+r*Math.sin(a1)}A${r} ${r} 0 0 ${d>0?1:0} ${V.x+r*Math.cos(a2)} ${V.y+r*Math.sin(a2)}Z`};
const arcp=(P1,P2,av)=>{const a1=ang(P1),D=nrm(ang(P2)-a1),inc=nrm(ang(av)-a1)>D,span=inc?D:2*PI-D;
 return`M${P1.x} ${P1.y}A${R} ${R} 0 ${span>PI?1:0} ${inc?1:0} ${P2.x} ${P2.y}`};

function mkFig(kind,init){
 const w=el('div','demo'),svg=document.createElementNS(NS,'svg'),ro=el('div','ro');
 svg.setAttribute('viewBox','0 0 480 400');w.append(svg,ro);
 const q=kind==='in'?{a:-1.745,b:1.396,c:-.524,d:2.618}:{a:kind==='tan'?-.05:-.25,c:.3,M:{x:410,y:kind==='tan'?230:200}};
 const DR={in:{pA:'a',pB:'b',pC:'c',pD:'d'},out:{pA:'a',pC:'c',M:'M'},tan:{pA:'a',M:'M'}}[kind];
 const hp={};const vis=new Set((init||'').split(' ').filter(Boolean)),fresh=new Set();let hl={},fr=false;
 const fl=t=>{const m=t.match(/^(.+)\/(.+)$/);return m?`<span class="fr"><span class="n">${m[1]}</span><span class="dn">${m[2]}</span></span>`:t};
 const f1=x=>x.toFixed(1),f2=x=>x.toFixed(2),L=(p,r)=>dist(p,r)/U;
 function draw(){
  let A,B,C,D,T,M=q.M;
  if(kind==='in'){A=P(q.a);B=P(q.b);C=P(q.c);D=P(q.d);M=inter(A,B,C,D);if(!M)return}
  else{[A,B]=sec(M,P(q.a));if(kind==='out')[C,D]=sec(M,P(q.c));else T=tangent(M)}
  const c=(k,b,f)=>b+(hl[k]?' h'+hl[k]:'')+(fresh.has(k)?(f?' nf':' nw'):'');
  const V=k=>vis.has(k);
  const ln=(k,a,b)=>V(k)?`<line pathLength="1" class="${c(k,'ln')}" x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}"/>`:'';
  const poly=(k,cl,...p)=>V(k)?`<polygon class="${c(k,cl,1)}" points="${p.map(t=>t.x+','+t.y).join(' ')}"/>`:'';
  const path=(k,d)=>V(k)?`<path pathLength="1" class="${c(k,'mk')}" d="${d}"/>`:'';
  const mk=(k,v,a,b)=>V(k)?`<path class="${c(k,'sc',1)}" d="${mkp(v,a,b,28)}"/>`:'';
  const pt=(k,n,p)=>{if(!V(k))return'';const dk=fr&&DR[k],dx=p.x-O.x,dy=p.y-O.y,l=Math.hypot(dx,dy)||1,o=k==='M'?16:20,
   lx=k==='M'&&kind==='in'?p.x+9:p.x+dx/l*o-5,ly=k==='M'&&kind==='in'?p.y-9:p.y+dy/l*o+6;
   return`<circle class="${c(k,'pt'+(dk?' hd':''),1)}" cx="${p.x}" cy="${p.y}" r="${dk?9:4.5}"/>`+(dk?(hp[dk]=p,`<circle class="hr" cx="${p.x}" cy="${p.y}" r="17"/>`):'')+`<text class="${fresh.has(k)?'lb nf':'lb'}" x="${lx}" y="${ly}">${n}</text>`};
  for(const k in hp)delete hp[k];let s='',rows;
  if(kind==='in'){
   const circ=V('circ')?`<circle pathLength="1" class="${c('circ','cir')}" cx="${O.x}" cy="${O.y}" r="${R}"/>`:'';
   s=poly('tMAD','tf',M,A,D)+poly('tMCB','tf',M,C,B)+circ+ln('sAM',M,A)+ln('sBM',M,B)+ln('sCM',M,C)+ln('sDM',M,D)+ln('sAD',A,D)+ln('sCB',C,B)
    +path('arcBD',arcp(B,D,A))+path('arcAC',arcp(A,C,D))+mk('aA',A,M,D)+mk('aC',C,M,B)+mk('aD',D,M,A)+mk('aB',B,M,C)+mk('aM1',M,A,D)+mk('aM2',M,C,B)
    +pt('pA','A',A)+pt('pB','B',B)+pt('pC','C',C)+pt('pD','D',D)+pt('M','M',M);
   rows=[['AM×BM',f1(L(A,M)*L(B,M))],['CM×DM',f1(L(C,M)*L(D,M))],['AM/CM',f2(L(A,M)/L(C,M))],['DM/BM',f2(L(D,M)/L(B,M))]];
  }else{
   const circ=V('circ')?`<circle pathLength="1" class="${c('circ','cir')}" cx="${O.x}" cy="${O.y}" r="${R}"/>`:'';
   if(kind==='out'){
    s=poly('quad','tf',A,B,D,C)+poly('tMAC','tf',M,A,C)+poly('tMDB','tf',M,D,B)+circ+ln('lMB',M,B)+ln('lMD',M,D)+ln('sMA',M,A)+ln('sMC',M,C)+ln('sAC',A,C)+ln('sBD',B,D)
     +mk('aA',A,M,C)+mk('aD',D,M,B)+pt('pA','A',A)+pt('pB','B',B)+pt('pC','C',C)+pt('pD','D',D)+pt('M','M',M);
    rows=[['MA×MB',f1(L(M,A)*L(M,B))],['MC×MD',f1(L(M,C)*L(M,D))],['MA/MD',f2(L(M,A)/L(M,D))],['MC/MB',f2(L(M,C)/L(M,B))]];
   }else{
    s=poly('tMTA','tf',M,T,A)+poly('tMBT','tf',M,B,T)+circ+ln('lMB',M,B)+ln('lMT',M,T)+ln('sMA',M,A)+ln('sTA',T,A)+ln('sTB',T,B)
     +path('arcTA',arcp(T,A,B))+mk('aT',T,M,A)+mk('aB',B,T,M)+pt('pA','A',A)+pt('pB','B',B)+pt('pT','T',T)+pt('M','M',M);
    rows=[['MT²',f1(L(M,T)**2)],['MA×MB',f1(L(M,A)*L(M,B))],['MA/MT',f2(L(M,A)/L(M,T))],['MT/MB',f2(L(M,T)/L(M,B))]];
   }
  }
  svg.innerHTML=s;fresh.clear();
  if(fr)ro.innerHTML=rows.map(r=>`<span>${fl(r[0])} = <b>${r[1]}</b></span>`).join('');
 }
 let drag=null;
 const pos=e=>{const m=svg.createSVGPoint();m.x=e.clientX;m.y=e.clientY;return m.matrixTransform(svg.getScreenCTM().inverse())};
 const near=e=>{const p=pos(e);let b=null,bd=50;for(const k in hp){const d=dist(p,hp[k]);if(d<bd){bd=d;b=k}}return b};
 const mv=e=>{if(!drag)return;e.preventDefault();const p=pos(e);
  if(drag==='M'){let m={x:clamp(p.x,20,465),y:clamp(p.y,20,380)};const d=dist(m,O),mn=R+12;if(d<mn)m={x:O.x+(m.x-O.x)/d*mn,y:O.y+(m.y-O.y)/d*mn};q.M=m}
  else q[drag]=ang(p);
  draw()};
 const up=()=>{drag=null;removeEventListener('pointermove',mv);removeEventListener('pointerup',up);removeEventListener('pointercancel',up)};
 svg.onpointerdown=e=>{if(!fr)return;const k=near(e);if(!k)return;e.preventDefault();drag=k;addEventListener('pointermove',mv,{passive:false});addEventListener('pointerup',up);addEventListener('pointercancel',up)};
 const cue=(sh,h)=>{(sh||'').split(' ').filter(Boolean).forEach(k=>{if(!vis.has(k)){vis.add(k);fresh.add(k)}});hl=h||{};draw()};
 draw();
 return{w,cue,free(sm){fr=true;ro.style.display='grid';if(sm){draw();return}cue(ALL[kind],{...(kind==='in'?T12:kind==='out'?T3:T4)})}};
}
stage(0);
</script>
